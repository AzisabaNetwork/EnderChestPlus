name: EnderChestPlus
main: jp.azisaba.lgw.ecplus.EnderChestPlus
version: ${version}
author: siloneco
description: ${description}
api-version: '1.21'
depend:
  - Vault
softdepend:
  - MythicMobs
  - CrackShot
commands:
  enderchestplus:
    permission: enderchestplus.command.enderchestplus
    aliases: [ ecp ]
  receivedropped:
    usage: /{LABEL}
    permission: enderchestplus.command.receivedropped
  ec2:
    description: Opens the ender chest or renames a page
    usage: /ec2 [rename <page> [name]]
permissions:
  enderchestplus.command.enderchestplus:
    default: op
